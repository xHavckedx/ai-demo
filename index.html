<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo AI</title>
</head>
<body>
    <h1>Bienvenido a nuestra consultora de IT</h1>
    <p>Ofrecemos servicios en todos los aspectos de la tecnología.</p>
    <button id="clientesBtn">Mostrar Clientes</button>
    <ul id="clientesList"></ul>

    <script>
        document.getElementById('clientesBtn').addEventListener('click', async () => {
            const response = await fetch('/clientes');
            const clientes = await response.json();
            const list = document.getElementById('clientesList');
            list.innerHTML = '';
            clientes.forEach(cliente => {
                const li = document.createElement('li');
                li.textContent = cliente.nombre;
                list.appendChild(li);
            });
        });
    </script>
</body>
</html>
