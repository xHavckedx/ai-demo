<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de pagos (mock)</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #1a1a1a; }
        body { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        h1 { font-size: 1.5rem; }
        section { margin-bottom: 2rem; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
        label { display: block; margin-top: 0.75rem; font-weight: 600; }
        input, button { font-size: 1rem; padding: 0.5rem; margin-top: 0.25rem; }
        button { cursor: pointer; margin-top: 1rem; }
        .metricas { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
        .metrica { background: #f5f5f5; padding: 0.75rem; border-radius: 6px; }
        .metrica strong { display: block; font-size: 1.25rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #eee; }
        .ok { color: #0a7; }
        .fail { color: #c33; }
        #mensaje { margin-top: 0.75rem; min-height: 1.25rem; }
    </style>
</head>
<body>
    <h1>Plataforma de pagos (mock)</h1>
    <p>Simula pagos y consulta métricas en tiempo real. No se procesan cargos reales.</p>

    <section aria-labelledby="metricas-titulo">
        <h2 id="metricas-titulo">Métricas</h2>
        <div class="metricas" id="metricas"></div>
        <button type="button" id="refreshMetricasBtn">Actualizar métricas</button>
    </section>

    <section aria-labelledby="pago-titulo">
        <h2 id="pago-titulo">Nuevo pago</h2>
        <form id="pagoForm">
            <label for="monto">Monto (EUR)</label>
            <input type="number" id="monto" name="monto" min="0" step="0.01" value="10.00" required>
            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" name="descripcion" placeholder="Concepto del pago">
            <button type="submit">Pagar (mock)</button>
        </form>
        <p id="mensaje"></p>
    </section>

    <section aria-labelledby="historial-titulo">
        <h2 id="historial-titulo">Historial reciente</h2>
        <button type="button" id="refreshPagosBtn">Actualizar historial</button>
        <table>
            <thead>
                <tr><th>Fecha</th><th>Monto</th><th>Estado</th><th>Descripción</th></tr>
            </thead>
            <tbody id="pagosBody"></tbody>
        </table>
    </section>

    <script>
        async function cargarMetricas() {
            const res = await fetch('/api/metricas');
            const m = await res.json();
            document.getElementById('metricas').innerHTML = `
                <div class="metrica"><span>Total pagos</span><strong>${m.total_pagos}</strong></div>
                <div class="metrica"><span>Completados</span><strong class="ok">${m.pagos_completados}</strong></div>
                <div class="metrica"><span>Fallidos</span><strong class="fail">${m.pagos_fallidos}</strong></div>
                <div class="metrica"><span>Volumen (EUR)</span><strong>${m.volumen_completado.toFixed(2)}</strong></div>
                <div class="metrica"><span>Tasa éxito</span><strong>${m.tasa_exito_porcentaje}%</strong></div>
            `;
        }

        async function cargarPagos() {
            const res = await fetch('/api/pagos');
            const pagos = await res.json();
            const tbody = document.getElementById('pagosBody');
            tbody.innerHTML = pagos.map(p => {
                const fecha = new Date(p.creado_en).toLocaleString('es-ES');
                const cls = p.estado === 'completado' ? 'ok' : 'fail';
                return `<tr>
                    <td>${fecha}</td>
                    <td>${p.monto.toFixed(2)}</td>
                    <td class="${cls}">${p.estado}</td>
                    <td>${p.descripcion}</td>
                </tr>`;
            }).join('');
        }

        document.getElementById('pagoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const mensaje = document.getElementById('mensaje');
            mensaje.textContent = 'Procesando…';
            const monto = parseFloat(document.getElementById('monto').value);
            const descripcion = document.getElementById('descripcion').value;
            const res = await fetch('/api/pagos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ monto, descripcion }),
            });
            const pago = await res.json();
            if (res.ok) {
                mensaje.textContent = pago.mensaje;
                mensaje.className = 'ok';
            } else {
                mensaje.textContent = pago.mensaje || pago.error || 'Error en el pago';
                mensaje.className = 'fail';
            }
            await cargarMetricas();
            await cargarPagos();
        });

        document.getElementById('refreshMetricasBtn').addEventListener('click', cargarMetricas);
        document.getElementById('refreshPagosBtn').addEventListener('click', cargarPagos);
        cargarMetricas();
        cargarPagos();
    </script>
</body>
</html>
